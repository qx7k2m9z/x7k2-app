<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Probe2</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#111; color:#fff; margin:0; padding:16px; }
  h1 { font-size:18px; }
  #out { font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-all; }
  iframe { width:100%; height:40vh; border:2px solid #1d9bf0; background:#000; }
</style>
</head>
<body>
<h1>アプリ読み込み診断</h1>
<div id="out"></div>
<script>
  var out = document.getElementById('out');
  function log(s){ out.textContent += s + '\n'; }
  log('診断ページ: 表示OK');
  var f = document.createElement('iframe');
  document.body.appendChild(f);
  log('アプリを枠内で読み込み中...');
  f.src = 'index.html';
  setTimeout(function(){
    try {
      var doc = f.contentDocument;
      var root = doc.querySelector('[data-generated-space-root]') || doc.body;
      var txt = ((root && root.textContent) || '').replace(/\s+/g, ' ').slice(0, 150);
      log('--- 8秒後の枠内の状態 ---');
      log('本文の先頭: ' + txt);
      if (txt.indexOf('読み込み中') >= 0) {
        log('結論: 枠内でも起動が止まっている');
      } else if (txt.length > 0) {
        log('結論: 枠内ではアプリが起動している');
      } else {
        log('結論: 本文が空');
      }
    } catch (e) {
      log('状態取得に失敗: ' + e.message);
    }
  }, 8000);
</script>
</body>
</html>
